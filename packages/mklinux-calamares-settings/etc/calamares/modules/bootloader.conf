# GRUB en BIOS y UEFI. bootloader-config instala antes grub-pc o grub-efi
# desde el repositorio de la ISO. installEFIFallback copia GRUB también a
# \EFI\BOOT\BOOTX64.EFI para firmwares que pierden las entradas de arranque.
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "mklinux"
installEFIFallback: true
