# Cuenta del sistema instalado: grupos de Debian, sudo, sin contraseña de
# root ni inicio automático. Nombre de equipo propuesto: mklinux.
---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false

# Exigencia de contraseña: que no esté vacía. Sin libpwquality: Calamares
# exige con ella una puntuación mínima de 40 (fija en su código) además de las
# opciones que se le pasen, y sin el diccionario de cracklib en la ISO
# rechaza cualquier contraseña ("error loading dictionary").
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "mklinux"
