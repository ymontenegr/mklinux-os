# Conserva la distribución activa en la sesión live (latam) y la escribe en
# /etc/default/keyboard del sistema instalado. guessLayout: false evita que
# Calamares la reemplace por una "adivinada" a partir del idioma (es_CO → es).
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
guessLayout: false
