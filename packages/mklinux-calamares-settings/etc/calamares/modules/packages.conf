# Quita del sistema instalado la sesión live y el instalador. El backend apt
# ejecuta después "apt-get --purge autoremove", que quita las dependencias
# que ya nadie usa (Qt 6 y KDE Frameworks de Calamares, entre otras).
---
backend: apt

operations:
  - remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - calamares
      - mklinux-calamares-settings
