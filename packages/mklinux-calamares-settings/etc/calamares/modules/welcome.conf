# Bienvenida. Sin requiredStorage a propósito: si no hay un tamaño mínimo de
# almacenamiento configurado, Calamares no ofrece "Instalar junto a" ni
# "Reemplazar una partición" (decisión del mantenedor; ver docs/build.md
# para el tamaño mínimo de disco recomendado).
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false

requirements:
    requiredRam:        1.0
    check:
        - ram
        - power
        - root
    required:
        - ram
        - root
