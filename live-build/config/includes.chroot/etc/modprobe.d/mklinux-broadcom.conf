# MKLinux OS: Wi-Fi Broadcom con brcmsmac.
#
# b43 y brcmsmac reclaman las mismas tarjetas (por ejemplo, BCM43224 de la
# MacBook Air 2012). El firmware de b43 no está en la imagen, así que si b43
# toma la tarjeta primero falla y brcmsmac ya no la toma. Este bloqueo solo
# evita la carga automática; "sudo modprobe b43" sigue funcionando.
#
# Para usar b43 en un sistema persistente o instalado: instalar
# firmware-b43-installer, borrar este archivo y ejecutar
# "sudo update-initramfs -u".
blacklist b43
