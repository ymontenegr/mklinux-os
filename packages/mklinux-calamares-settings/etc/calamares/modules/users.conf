# Cuenta del sistema instalado: grupos de Debian, sudo, sin contraseña de
# root ni inicio automático. Nombre de equipo propuesto: mklinux.
---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "mklinux"
