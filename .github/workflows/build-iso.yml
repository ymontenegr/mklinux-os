# Construye la ISO de MKLinux OS en cada push a main y la publica como artifact.
name: build-iso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tamaño máximo de la ISO de desarrollo (zstd), en bytes.
  MAX_ISO_BYTES: "1200000000"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Construir la ISO
        run: scripts/build.sh

      - name: Verificar la identidad en la ISO
        run: |
          sudo apt-get install -y -qq squashfs-tools > /dev/null
          iso="$(ls out/mklinux-os-*-amd64.iso)"
          sudo mkdir -p /mnt/iso
          sudo mount -o loop,ro "${iso}" /mnt/iso
          unsquashfs -n -d /tmp/fs /mnt/iso/live/filesystem.squashfs etc/os-release usr/lib/os-release > /dev/null
          sudo umount /mnt/iso
          ls -l /tmp/fs/etc/os-release
          cat /tmp/fs/etc/os-release
          grep -qx 'NAME="MKLinux OS"' /tmp/fs/etc/os-release
          grep -qx 'ID=mklinux' /tmp/fs/etc/os-release

      - name: Verificar tamaño y contenido
        run: |
          iso="$(ls out/mklinux-os-*-amd64.iso)"
          size="$(stat -c %s "${iso}")"
          sudo mkdir -p /mnt/iso
          sudo mount -o loop,ro "${iso}" /mnt/iso
          live=/mnt/iso/live
          packages="${live}/filesystem.packages"
          count="$(wc -l < "${packages}")"
          squashfs="$(stat -c %s "${live}/filesystem.squashfs")"
          initrd="$(stat -c %s "${live}/initrd.img")"
          errors=()
          for pkg in firmware-nvidia-graphics desktop-base; do
            if grep -qP "^${pkg}\t" "${packages}"; then
              errors+=("la ISO no debe incluir ${pkg}")
            fi
          done
          if ! grep -qP "^pulseaudio\t" "${packages}"; then
            errors+=("falta pulseaudio en la ISO")
          fi
          sudo umount /mnt/iso
          if [ "${size}" -gt "${MAX_ISO_BYTES}" ]; then
            errors+=("la ISO pesa ${size} bytes, por encima del límite de ${MAX_ISO_BYTES}")
          fi
          {
            echo "### Tamaño de la ISO"
            echo ""
            echo "| | Bytes | MB |"
            echo "|---|---:|---:|"
            echo "| ISO | ${size} | $((size / 1000000)) |"
            echo "| Límite | ${MAX_ISO_BYTES} | $((MAX_ISO_BYTES / 1000000)) |"
            echo "| filesystem.squashfs | ${squashfs} | $((squashfs / 1000000)) |"
            echo "| initrd.img | ${initrd} | $((initrd / 1000000)) |"
            echo ""
            echo "Paquetes: ${count}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${#errors[@]}" -gt 0 ]; then
            for e in "${errors[@]}"; do echo "::error::${e}"; done
            exit 1
          fi
          echo "OK: ${size} bytes (límite ${MAX_ISO_BYTES}), ${count} paquetes"

      - name: Calcular la suma SHA-256
        id: sum
        run: |
          cd out
          iso="$(ls mklinux-os-*-amd64.iso)"
          sha256sum "${iso}" > "${iso}.sha256"
          cat "${iso}.sha256"
          du -h "${iso}"
          echo "name=${iso%.iso}" >> "${GITHUB_OUTPUT}"

      - name: Publicar la ISO como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sum.outputs.name }}
          path: |
            out/*.iso
            out/*.iso.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
